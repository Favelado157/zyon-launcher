name: Publicar atualização do Zyon Client
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: zyon-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Instalar dependências
        run: npm ci
      - name: Definir versão e canal de publicação
        shell: pwsh
        run: |
          $base = Get-Content package.json | ConvertFrom-Json
          $parts = $base.version.Split('.')
          $patch = [int]$parts[2] + [int]$env:GITHUB_RUN_NUMBER
          $version = "$($parts[0]).$($parts[1]).$patch"
          npm version $version --no-git-tag-version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run configure:publisher -- --repository "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "ZYON_RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Compilar e testar o client independente
        run: npm run test:java
      - name: Testar launcher, preparação e integridade
        run: npm test
      - name: Gerar instalador Windows
        run: npm run dist:win
      - name: Gerar verificação
        run: node build/prepare-release.cjs --checksums
      - name: Publicar release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = $env:ZYON_RELEASE_VERSION
          $notes = (Get-Content build/release-notes.md -Raw).Replace('{{VERSION}}', $v)
          Set-Content release-notes.txt -Value $notes -Encoding UTF8
          gh release create "v$v" "dist/Zyon-Launcher-Setup-$v.exe" "dist/SHA256SUMS.txt" "payload/zyon-client-1.8.9-2.0.0.jar" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "Zyon Client $v" --notes-file release-notes.txt
