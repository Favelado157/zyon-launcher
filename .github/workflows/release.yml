name: Publicar atualização do Zyon
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: zyon-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Definir versão e canal de publicação
        shell: pwsh
        env:
          MICROSOFT_CLIENT_ID: ${{ vars.MICROSOFT_CLIENT_ID }}
        run: |
          $base = Get-Content package.json | ConvertFrom-Json
          $parts = $base.version.Split('.')
          $patch = [int]$parts[2] + [int]$env:GITHUB_RUN_NUMBER
          $version = "$($parts[0]).$($parts[1]).$patch"
          npm version $version --no-git-tag-version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $clientId = $env:MICROSOFT_CLIENT_ID
          if ([string]::IsNullOrWhiteSpace($clientId)) {
            $clientId = (Get-Content release-config.json | ConvertFrom-Json).microsoftClientId
          }
          npm run configure:publisher -- --repository "$env:GITHUB_REPOSITORY" --client-id "$clientId"
          if ($LASTEXITCODE -ne 0) { throw 'A configuração do canal ou do Client ID informado é inválida.' }
          if (-not $clientId) { Write-Host 'Publicando com canal de atualizações. O login online próprio ainda está pendente.' }
          "ZYON_RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Guardar caminho do compilador Java 8
        shell: pwsh
        run: '"ZYON_JAVA8=$env:JAVA_HOME" >> $env:GITHUB_ENV'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compilar o cliente Minecraft
        shell: pwsh
        run: |
          Push-Location client-src
          .\gradlew.bat "-Porg.gradle.java.installations.paths=$env:ZYON_JAVA8" build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Copy-Item client-src/build/libs/zyon-1.8.9-1.2.2.jar payload/zyon-1.8.9-1.2.2.jar -Force
          node build/prepare-release.cjs
      - name: Testar o launcher
        shell: pwsh
        run: |
          $forge = Join-Path $env:RUNNER_TEMP 'forge-installer.jar'
          Invoke-WebRequest 'https://maven.minecraftforge.net/net/minecraftforge/forge/1.8.9-11.15.1.2318-1.8.9/forge-1.8.9-11.15.1.2318-1.8.9-installer.jar' -OutFile $forge
          $manifest = Invoke-RestMethod 'https://piston-meta.mojang.com/mc/game/version_manifest_v2.json'
          $vanilla = $manifest.versions | Where-Object { $_.id -eq '1.8.9' } | Select-Object -First 1
          $metadata = Join-Path $env:RUNNER_TEMP 'minecraft189.json'
          Invoke-WebRequest $vanilla.url -OutFile $metadata
          if ((Get-FileHash $metadata -Algorithm SHA1).Hash -ne $vanilla.sha1) { throw 'Metadados Minecraft inválidos.' }
          $env:FORGE_FIXTURE = $forge
          $env:MINECRAFT_FIXTURE = $metadata
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Gerar instalador Windows
        run: npm run dist:win
      - name: Gerar verificação
        run: node build/prepare-release.cjs --checksums
      - name: Publicar release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = $env:ZYON_RELEASE_VERSION
          @"
          Zyon Launcher $v — azul neon e novo menu dentro do jogo.

          Instalação para Windows x64. Mundos e configurações são preservados.
          Novo tema azul neon no launcher inteiro: botões, painéis, navegação, arte do portal e ícone do aplicativo/instalador.
          Menu do Shift direito reorganizado com categorias, busca, lista de funções e painel de ajustes.
          Botão ? em cada função: passe o mouse para ler uma explicação detalhada do comportamento, ajustes e dependências.
          Ajuda e ativação têm áreas separadas. Consultar a ajuda não ativa a função.
          Cliente 1.2.2. Perfis, atalhos, mundos e posições dos keystrokes são mantidos; o JAR anterior é movido para backup.
          Modo offline sem conta Microsoft: Minha conta > digite seu nick > Usar este nick > Play offline. A primeira preparação precisa de internet.
          Para mundos locais e servidores sem autenticação. Servidores com autenticação exigem uma conta original e o modo Microsoft. O nick determina a identidade offline; mudar o nome pode mudar seu inventário/progresso em servidores.
          Menu noturno com cerejeiras, lago, ponte iluminada e título ZYON, baseado na imagem enviada pelo publicador. Botões funcionais centralizados, sem imagens de botões duplicadas.
          Keystrokes arrastáveis: Shift direito > Editar HUD, ou Ctrl direito. Tamanho, cores, transparência e CPS em Interface > Keystrokes.
          OptiFine opcional: na aba Instalação, baixe o JAR oficial 1.8.9 HD U M5 e use Importar. O zoom usa C; a capa exige uma capa OptiFine ativa. O JAR OptiFine não acompanha o instalador.
          O modo Microsoft é opcional e ainda depende da aprovação do aplicativo e de uma conta com acesso ao Java; a autenticação real não foi validada nesta publicação. O modo offline não depende desse cadastro.
          "@ | Set-Content release-notes.txt -Encoding UTF8
          gh release create "v$v" "dist/Zyon-Launcher-Setup-$v.exe" "dist/SHA256SUMS.txt" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "Zyon $v" --notes-file release-notes.txt
