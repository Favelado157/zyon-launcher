name: Validar Zyon Client
on: [pull_request]
permissions:
  contents: read
jobs:
  independent-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - run: npm ci
      - run: npm run test:java
      - run: npm test
